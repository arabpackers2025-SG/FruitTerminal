# Deploy settings for Fruit Terminal (read by deploy/remote-deploy.sh on the VPS).
# The Next.js app lives in the web/ subdir; data/backups live in $APP_DIR/data, outside the synced app folder.
# Ports already in use on this server (never reuse one): 3000 Artovia, 3100 Wasla/Hirenza, 3101 green-fields,
# 3102 Fraiza, 3103 GFI, 4000 Hurexa, 5432 PostgreSQL. Fruit Terminal takes 3110 (guarded below).
APP_NAME=fruitterminal
APP_PORT=3110
APP_SUBDIR=web
BUILD_CMD="npm install --include=dev --no-audit --no-fund && npx drizzle-kit migrate && npm run build && npx tsx src/db/seed.ts"
START_SCRIPT="node_modules/next/dist/bin/next"
START_ARGS="start"
HEALTH_PATH=/api/health
MAX_BODY=30MiB

# Written once into $APP_DIR/.env.production (keys already present are kept). The DB password is generated here on the
# first deploy and never changes after. Fruit Terminal uses the shared PostgreSQL on 127.0.0.1:5432 with its OWN role
# and database; it has no rights on any other app's database.
env_defaults() {
  echo "DATABASE_URL=postgresql://fruitterminal:$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32)@127.0.0.1:5432/fruitterminal"
  echo "DATA_DIR=$APP_DIR/data"
  echo "SITE_URL=https://$DOMAIN"
}

pre_build() {
  # The site address follows the DOMAIN of this deploy.
  sed -i "s#^SITE_URL=.*#SITE_URL=https://$DOMAIN#" "$APP_DIR/.env.production"
  mkdir -p "$APP_DIR/data/uploads" "$APP_DIR/backups"
  # Migrations and the seed read the same settings the app runs with.
  set -a
  . "$APP_DIR/.env.production"
  [ -f "$APP_DIR/app-secrets.env" ] && . "$APP_DIR/app-secrets.env"
  set +a

  # Ensure this app's own role + database exist on the shared PostgreSQL 18 (127.0.0.1:5432).
  # Scoped to the fruitterminal database only, so it cannot touch any other app's data.
  PW=$(printf '%s' "$DATABASE_URL" | sed -nE 's#.*://[^:]+:([^@]+)@.*#\1#p')
  if id postgres >/dev/null 2>&1; then
    has_role=$(su -s /bin/bash postgres -c "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='fruitterminal'\"" 2>/dev/null)
    [ "$has_role" = "1" ] || su -s /bin/bash postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE ROLE fruitterminal LOGIN PASSWORD '$PW'\""
    has_db=$(su -s /bin/bash postgres -c "psql -tAc \"SELECT 1 FROM pg_database WHERE datname='fruitterminal'\"" 2>/dev/null)
    [ "$has_db" = "1" ] || su -s /bin/bash postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE fruitterminal OWNER fruitterminal\""
  else
    echo "!! No local 'postgres' user found. Point DATABASE_URL in $APP_DIR/.env.production at a reachable database and re-run."
  fi

  # Nightly database backup (keep 14 days) in $APP_DIR/backups.
  cron="23 2 * * * su -s /bin/bash postgres -c 'pg_dump fruitterminal' | gzip > $APP_DIR/backups/db-\$(date +\\%F).sql.gz && find $APP_DIR/backups -name 'db-*.sql.gz' -mtime +14 -delete"
  (crontab -l 2>/dev/null | grep -v "$APP_DIR/backups"; echo "$cron") | crontab - 2>/dev/null || echo "!! could not install the backup cron job"
}

pre_start() {
  # Refuse to start if another program already owns our port (two apps must never share one).
  holder=$(ss -ltnp 2>/dev/null | awk -v p=":$APP_PORT\$" '$4 ~ p {print $NF}' | head -1)
  if [ -n "$holder" ] && ! pm2 jlist 2>/dev/null | grep -q "\"name\":\"$APP_NAME\""; then
    echo "!! Port $APP_PORT is already used by: $holder. Pick a free APP_PORT in deploy/app.conf."; exit 1
  fi
}
