name: Deploy to VPS

# Deploys this app to the VPS over SSH, from GitHub (no laptop needed).
# Secrets (repository or organization level): VPS_HOST, VPS_USER, VPS_SSH_KEY, optional VPS_PORT.
# Any secret named APP_<NAME> is sent to the server as <NAME> in the app's environment (e.g. APP_SMTP_PASSWORD).
# Variable (Settings -> Secrets and variables -> Actions -> Variables): DOMAIN, unless the default below is right.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# The site is ft.saguenygroup.com for now; a repository variable DOMAIN overrides it (e.g. fruitterminal.com later).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.DOMAIN || 'ft.saguenygroup.com' }}
      APP_DIR: /var/www/fruitterminal
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          [ -n "${{ secrets.VPS_HOST }}" ] || missing="$missing VPS_HOST"
          [ -n "${{ secrets.VPS_USER }}" ] || missing="$missing VPS_USER"
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add them once at the organization level (Settings → Secrets and variables → Actions, access: all repositories) or in this repository, then re-run."
            exit 1
          fi
          if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "SET-ME" ]; then
            echo "::error::No domain. Add a repository variable DOMAIN (Settings → Secrets and variables → Actions → Variables), e.g. app.example.com, point its A record at the VPS, then re-run."
            exit 1
          fi
          echo "Deploying to https://$DOMAIN ($APP_DIR)"

      - name: Prepare SSH
        run: |
          set +e
          mkdir -p ~/.ssh
          # Accept the raw key text or a base64-encoded key (copy-proof on Windows).
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_raw
          if grep -q "BEGIN" ~/.ssh/id_raw; then
            cp ~/.ssh/id_raw ~/.ssh/id_deploy; echo >> ~/.ssh/id_deploy
            grep -q "END" ~/.ssh/id_raw || { echo "::error::VPS_SSH_KEY has a BEGIN line but no END line. Paste the whole key, including the -----END ... KEY----- line."; exit 1; }
          else
            tr -d ' \n' < ~/.ssh/id_raw | base64 -d > ~/.ssh/id_deploy 2>/dev/null || { echo "::error::VPS_SSH_KEY is not a private key. It should start with -----BEGIN OPENSSH PRIVATE KEY----- (you may have pasted the public key, the one starting with ssh-ed25519)."; exit 1; }
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pub 2>/tmp/kerr || { echo "::error::VPS_SSH_KEY could not be read as a private key: $(cat /tmp/kerr). Paste the full private key, from the BEGIN line to the END line."; exit 1; }
          echo "Key fingerprint: $(ssh-keygen -lf /tmp/pub)"
          port="${{ secrets.VPS_PORT || 22 }}"
          for i in 1 2; do ssh-keyscan -t ed25519 -T 15 -p "$port" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break; sleep 10; done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::The server did not answer SSH on port $port. Check VPS_HOST (should be the IP, e.g. 50.6.242.250, with no http:// or spaces) and that SSH is open in the VPS firewall."; exit 1; }
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port $port
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            ConnectTimeout 20
            # one shared connection for the whole job: the VPS firewall rate-limits new SSH connections (ufw LIMIT)
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h-%p
            ControlPersist 15m
            ServerAliveInterval 30
          CFG
          # the firewall allows about 6 new SSH connections per 30 s, so wait it out before retrying
          for i in 1 2 3; do
            out=$(ssh -o BatchMode=yes vps 'echo connected as $(whoami) on $(hostname)' 2>&1) && break
            echo "login attempt $i: $out"; sleep 35
          done
          echo "$out" | grep -q "^connected as" || { echo "::error::SSH login was refused: $(echo "$out" | tail -2 | tr '\n' ' '). The public half of VPS_SSH_KEY must be in /root/.ssh/authorized_keys on the server, and VPS_USER must be the user it belongs to (root)."; exit 1; }
          echo "::notice::$out"

      - name: Sync source to server
        run: |
          ssh vps "mkdir -p $APP_DIR/app $APP_DIR/data; command -v rsync >/dev/null || (export DEBIAN_FRONTEND=noninteractive; apt-get update -y -qq && apt-get install -y -qq rsync) || dnf install -y rsync"
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude '*/node_modules' --exclude .next --exclude '*/.next' --exclude dist --exclude '*/dist' \
            --exclude /legacy --exclude '*.db' --exclude .env --exclude '.env.*' --exclude /data --exclude '*/data/' --exclude /uploads \
            ./ vps:$APP_DIR/app/

      - name: Send app secrets (APP_* secrets)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Every secret named APP_<NAME> becomes <NAME>=value on the server. Values travel over stdin, never on a command line.
          umask 077; : > app-secrets.env
          cat > /tmp/app-secrets.py <<'PY'
          import json, sys
          for k, v in json.load(sys.stdin).items():
              if k.startswith("APP_") and v:
                  v = v.replace("\r", "").replace("\n", "").replace("\\", "\\\\").replace("'", "\\'")
                  print(f"{k[4:]}='{v}'")
          PY
          echo "$ALL_SECRETS" | python3 /tmp/app-secrets.py >> app-secrets.env
          echo "Sending $(wc -l < app-secrets.env) app secret(s)"
          ssh vps "umask 077; cat > $APP_DIR/app-secrets.env" < app-secrets.env
          rm -f app-secrets.env

      - name: Provision (first time) and deploy
        run: |
          set +e
          ssh vps "APP_DIR=$APP_DIR DOMAIN=$DOMAIN bash $APP_DIR/app/deploy/remote-deploy.sh" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          # Surface the end of the log as an annotation, readable through the API without downloading logs.
          grep -v '^\s*[│├└┌┐┘┤┬┴─]' deploy.log | tail -25 | cut -c1-200 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          if [ "$status" -ne 0 ]; then echo "::error title=Deploy failed::$(cat tail.txt)"; exit "$status"; fi
          echo "::notice title=Deploy log tail::$(cat tail.txt)"

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/api/health" || true)
          echo "https://$DOMAIN/api/health -> $code"
          case "$code" in 2*|3*) echo "Live.";; *) echo "::warning::The site did not answer with 2xx/3xx yet (DNS or certificate still propagating?). Check the log above.";; esac
